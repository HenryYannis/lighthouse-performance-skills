name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SKILL.md 和 Cursor 规则必须保持同步
      - name: Check rules are in sync
        run: node scripts/sync-rules.js --check

      # README、README_ZH、SKILL.md 里的 npx 命令必须固定到同一个提交
      - name: Check npx pin is consistent
        run: node scripts/pin-npx.js --check

      # 起一个静态服务器托管 example，跑一次完整 audit
      - name: Audit example page
        run: |
          python3 -m http.server 8080 -d example > /dev/null 2>&1 &
          sleep 2
          npm run audit -- --url http://localhost:8080 --output reports/ci/report.json
          test -s reports/ci/report.json
          test -s reports/ci/report.html
          test -s reports/ci/report.md

      # 在副本上跑图片优化，不动仓库里的示例图
      - name: Optimize images (on a copy)
        run: |
          cp -r example/images "$RUNNER_TEMP/images"
          npm run optimize -- --dir "$RUNNER_TEMP/images" --quality 80
          ls -la "$RUNNER_TEMP/images"
          test -s "$RUNNER_TEMP/images/large-photo.webp"
