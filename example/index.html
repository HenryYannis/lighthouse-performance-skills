<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighthouse Skill Demo Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
        }
        .intro-text {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .image-container {
            margin: 20px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            background-color: #1e293b;
        }
        /* Intentionally missing width/height on img tag to trigger CLS */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .dynamic-banner {
            background: linear-gradient(90deg, #f43f5e, #fb7185);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
        }
        footer {
            margin-top: 60px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <h1>⚡ Web Performance Demo Site</h1>
    <p class="intro-text">
        This is a testing page designed for checking the performance optimization flow. 
        It contains a large unoptimized image and dynamic layout patterns.
    </p>

    <!-- Huge unoptimized image placeholder -->
    <div class="image-container">
        <img src="images/large-photo.jpg" alt="Unoptimized Hero Banner">
    </div>

    <!-- Layout shifting simulation element -->
    <div id="dynamic-content"></div>

    <footer>
        <p>&copy; 2026 lighthouse-performance-skills. All rights reserved.</p>
    </footer>

    <!-- Simulates dynamic content insertion that triggers CLS -->
    <script>
        setTimeout(() => {
            const container = document.getElementById('dynamic-content');
            const element = document.createElement('div');
            element.className = 'dynamic-banner';
            element.innerText = '🔥 Flash Sale: 50% off all game assets! (Dynamic Banner causing CLS)';
            container.appendChild(element);
        }, 1500);
    </script>
</body>
</html>
